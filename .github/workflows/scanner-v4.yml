name: Global TikTok Scanner V4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  global-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install TikTokLive==7.0.1 httpx playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Discover global LIVE and scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u scanner_v4.py
