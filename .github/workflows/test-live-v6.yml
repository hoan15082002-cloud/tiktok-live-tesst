name: TikTok LIVE Connection Test V6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install TikTokLive==7.0.1 httpx

      - name: Test LIVE connection
        run: python -u test_live_v6.py
