name: Test TikTokLive

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install TikTokLive
        run: python -m pip install TikTokLive==7.0.1

      - name: Test connection
        run: |
          python - <<'PY'
          import asyncio
          import httpx
          from TikTokLive import TikTokLiveClient

          async def main():
              username = 'banaking922'
              async with httpx.AsyncClient(follow_redirects=True, timeout=15) as http:
                  r = await http.get(f'https://www.tiktok.com/@{username}/live')
                  print('HTTP STATUS:', r.status_code)
                  print('FINAL PATH:', r.url.path)
                  print('REDIRECTS:', [x.status_code for x in r.history])
              client = TikTokLiveClient(unique_id=username)
              try:
                  print('ROOM ID:', await client._web.fetch_room_id_from_html(username))
              except Exception as e:
                  print('HTML ERROR:', type(e).__name__, str(e)[:200])
              try:
                  print('IS LIVE:', await client.is_live())
              except Exception as e:
                  print('API ERROR:', type(e).__name__, str(e)[:200])

          asyncio.run(main())
          PY
