name: Test TikTok LIVE WebSocket

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install TikTokLive
        run: python -m pip install TikTokLive==7.0.1

      - name: Test WebSocket and LIVE events
        run: |
          python - <<'PY'
          import asyncio
          from TikTokLive.events import ConnectEvent, DisconnectEvent, CommentEvent, GiftEvent, EnvelopeEvent
          from TikTokLive.events import ConnectEvent, DisconnectEvent, CommentEvent, GiftEvent

          USERNAME = "loupleking"
          client = TikTokLiveClient(unique_id=USERNAME)

          @client.on(ConnectEvent)
          async def on_connect(event):
              print("WEBSOCKET CONNECTED", flush=True)
              print("ROOM ID:", client.room_id, flush=True)

          @client.on(DisconnectEvent)
          async def on_disconnect(event):
              print("WEBSOCKET DISCONNECTED", flush=True)

          @client.on(CommentEvent)
          async def on_comment(event):
              print("COMMENT EVENT RECEIVED", flush=True)

          @client.on(GiftEvent)
          async def on_gift(event):
              print("GIFT EVENT RECEIVED", flush=True)
                        @client.on(EnvelopeEvent)
          async def on_envelope(event):
              print("TREASURE BOX EVENT DETECTED", flush=True)
              print("EVENT DATA:", str(event)[:1500], flush=True)

          async def main():
              print("TESTING USER:", USERNAME, flush=True)
              try:
                  await asyncio.wait_for(client.start(), timeout=90)
              except asyncio.TimeoutError:
                  print("TEST FINISHED: 90 SECOND TIMEOUT", flush=True)
              except Exception as exc:
                  print("TEST ERROR:", type(exc).__name__, str(exc)[:500], flush=True)
              finally:
                  try:
                      await client.disconnect()
                  except Exception:
                      pass

          asyncio.run(main())
          PY
