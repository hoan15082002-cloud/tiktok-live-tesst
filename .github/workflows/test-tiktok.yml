name: TikTok Treasure Scanner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install TikTokLive==7.0.1 httpx

      - name: Scan LIVE and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import asyncio
          import os
          import httpx
          from TikTokLive import TikTokLiveClient
          from TikTokLive.events import ConnectEvent, EnvelopeEvent

          USERNAME = "_ttna208"
          SCAN_SECONDS = 720

          TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID", "")

          if not TOKEN or not CHAT_ID:
              raise RuntimeError("Missing Telegram GitHub Secrets")

          client = TikTokLiveClient(unique_id=USERNAME)
          seen = set()

          async def send_telegram(message):
              url = f"https://api.telegram.org/bot{TOKEN}/sendMessage"
              try:
                  async with httpx.AsyncClient(timeout=20) as http:
                      response = await http.post(
                          url,
                          data={"chat_id": CHAT_ID, "text": message}
                      )
                      data = response.json()
                      if response.status_code == 200 and data.get("ok"):
                          print("TELEGRAM SENT", flush=True)
                      else:
                          print(
                              "TELEGRAM ERROR:",
                              response.status_code,
                              data.get("description", "Unknown error"),
                              flush=True
                          )
              except Exception as exc:
                  print("TELEGRAM REQUEST ERROR:", type(exc).__name__, flush=True)

          @client.on(ConnectEvent)
          async def on_connect(event):
              print("WEBSOCKET CONNECTED", flush=True)
              print("ROOM ID:", client.room_id, flush=True)
              await send_telegram(
                  "TikTok Scanner started\n"
                  f"Account: @{USERNAME}\n"
                  "WebSocket connected"
              )

          @client.on(EnvelopeEvent)
          async def on_envelope(event):
              info = getattr(event, "envelope_info", None)
              envelope_id = str(getattr(info, "envelope_id", "") or "")
              room_id = str(getattr(info, "room_id", "") or "")

              if not envelope_id:
                  print("ENVELOPE WITHOUT ID", flush=True)
                  return

              if envelope_id in seen:
                  print("DUPLICATE SKIPPED:", envelope_id, flush=True)
                  return

              seen.add(envelope_id)
              print("TREASURE BOX EVENT DETECTED", flush=True)
              print("ENVELOPE ID:", envelope_id, flush=True)
              print("ROOM ID:", room_id, flush=True)

              message = (
                  "TikTok LIVE - Phat hien su kien ruong/phong bao!\n\n"
                  f"Chu phong: @{USERNAME}\n"
                  f"Ma ruong: {envelope_id}\n"
                  f"Room ID: {room_id}\n"
                  "So xu: Chua xac dinh\n"
                  "Thoi gian mo: Chua xac dinh\n\n"
                  f"https://www.tiktok.com/@{USERNAME}/live"
              )
              await send_telegram(message)

          async def main():
              print("START SCANNING:", USERNAME, flush=True)
              try:
                  await asyncio.wait_for(
                      client.start(),
                      timeout=SCAN_SECONDS
                  )
              except asyncio.TimeoutError:
                  print("SCAN FINISHED: 12 MINUTES", flush=True)
              except Exception as exc:
                  print(
                      "SCAN ERROR:",
                      type(exc).__name__,
                      str(exc)[:300],
                      flush=True
                  )
              finally:
                  try:
                      await client.disconnect()
                  except Exception:
                      pass
                  print("UNIQUE ENVELOPES:", len(seen), flush=True)

          asyncio.run(main())
          PY
